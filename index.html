<!doctype html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Installable as a home-screen app (see README.md's "iPhone app" section) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokédex">
<meta name="theme-color" content="#14161b">

<!-- Applies the saved theme before first paint, so there's no flash of the
     wrong theme while js/app.js's module chain is still loading. Keep the
     localStorage key in sync with js/deviceSettings.js's THEME_KEY. -->
<script src="js/theme-init.js"></script>
</head>
<body>

<div id="app">
  <header class="topbar">
    <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
    <div class="brand"><img src="assets/logo.png" alt="Pokémon D&amp;D" class="brand-logo"><span class="brand-text">Pokémon D&amp;D Companion</span></div>
    <div class="account-chip" id="accountChip"></div>
  </header>

  <!-- Filled in by js/app.js from the active game system (js/systems/) -->
  <nav id="sideNav" class="sidenav"></nav>

  <main id="mainView" class="main">
    <div id="loading" class="loading">Loading data…</div>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
