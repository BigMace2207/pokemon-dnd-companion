<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>D&amp;D Companion</title>
<link rel="icon" href="assets/dnd-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;700;900&family=Fraunces:opsz,wght@9..144,400..700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dnd5e.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/planner.css"><link rel="stylesheet" href="css/planner-board.css"><link rel="stylesheet" href="css/whiteboard.css"><link rel="stylesheet" href="css/planner-hub.css"><link rel="stylesheet" href="css/keywords.css">
<link rel="stylesheet" href="css/hub.css"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/cosmic.css"><link rel="stylesheet" href="css/vvd.css">
<link rel="stylesheet" href="css/lava-bricks.css">
<link rel="stylesheet" href="css/lava.css">
<link rel="stylesheet" href="css/mobile.css">

<!-- Installable as a home-screen app (see README.md's "iPhone app" section) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D&amp;D Companion">
<meta name="theme-color" content="#000000">

<!-- Applies the saved theme before first paint, so there's no flash of the
     wrong theme while js/app.js's module chain is still loading. Keep the
     localStorage key in sync with js/deviceSettings.js's THEME_KEY. -->
<script src="js/theme-init.js"></script>
<!-- Picks the phone layout before first paint (js/layout-init.js; the phone copy is css/mobile.css + js/mobile/) -->
<script src="js/layout-init.js"></script>
</head>
<body>

<div id="app">
  <header class="topbar">
    <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
    <div class="brand"><img src="assets/dnd-logo.svg" alt="D&amp;D" class="brand-logo"><span class="brand-text">D&amp;D Companion</span></div>
    <div class="account-chip" id="accountChip"></div>
  </header>

  <!-- Filled in by js/app.js from the active game system (js/systems/) -->
  <nav id="sideNav" class="sidenav"></nav>

  <main id="mainView" class="main">
    <div id="loading" class="loading">Loading data…</div>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
